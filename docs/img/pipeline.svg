<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="VLA 真机部署四层链路架构图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5b78"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f64"/>
    </marker>
    <style>
      .card { fill:#ffffff; }
      .box  { fill:#eef3fb; stroke:#3f5b8a; stroke-width:1.6; }
      .alt  { fill:#eef9f3; stroke:#1a7f64; stroke-width:1.6; }
      .grey { fill:#f4f5f7; stroke:#9aa4b2; stroke-width:1.4; stroke-dasharray:5 4; }
      .t    { font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; fill:#1b2537; }
      .h    { font-size:18.5px; font-weight:700; }
      .s    { font-size:13.5px; fill:#46536b; }
      .n    { font-size:13.5px; fill:#1a7f64; font-weight:600; }
      .lbl  { font-size:12.5px; fill:#4a5b78; font-family:"Consolas","Cascadia Mono",monospace; }
      .flow { stroke:#4a5b78; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .fb   { stroke:#1a7f64; stroke-width:2; fill:none; stroke-dasharray:6 4; marker-end:url(#arrowBack); }
      .tag  { font-size:12.5px; fill:#6b7788; }
    </style>
  </defs>

  <rect class="card" x="0" y="0" width="960" height="620" rx="14"/>

  <text class="t h" x="28" y="40">VLA 真机部署侧链路（四层 + 安全）</text>
  <text class="t tag" x="28" y="62">无机器人、无相机条件下可复现 · ROS 2 Jazzy · RTX 5060 8 GB</text>

  <!-- ① 策略层 -->
  <rect class="box" x="28" y="82" width="540" height="78" rx="10"/>
  <text class="t h" x="46" y="112">① 策略层　SmolVLA 450M</text>
  <text class="t s" x="46" y="136">lerobot/smolvla_base · 动作 50×6 · dt=1/30 s · 显存 0.90 GB</text>
  <rect class="alt" x="596" y="82" width="260" height="78" rx="10"/>
  <text class="t h" x="614" y="112">TensorRT</text>
  <text class="t n" x="614" y="136">0.074 s/次 · ≈8 Hz</text>

  <path class="flow" d="M 298 160 L 298 196"/>
  <text class="t lbl" x="312" y="185">/vla/action_chunk　ActionChunk (50×6)</text>

  <!-- ② 桥接层 -->
  <rect class="box" x="28" y="200" width="540" height="90" rx="10"/>
  <text class="t h" x="46" y="230">② 桥接层　vla_bridge</text>
  <text class="t s" x="46" y="254">插值 · 限幅 ±1.5 rad · 限速 0.02 rad/拍 · 看门狗 · 急停</text>
  <text class="t s" x="46" y="274">块频率 2 Hz → 控制 100 Hz　（部署侧真正要写的代码）</text>
  <rect class="alt" x="596" y="200" width="260" height="90" rx="10"/>
  <text class="t h" x="614" y="230">100 Hz</text>
  <text class="t n" x="614" y="254">跟踪误差 0.9 mrad</text>
  <text class="t tag" x="614" y="274">（Gazebo 串联实测）</text>

  <path class="flow" d="M 298 290 L 298 326"/>
  <text class="t lbl" x="312" y="315">/joint_targets　Float64MultiArray (6)</text>

  <!-- ③ 控制层 -->
  <rect class="box" x="28" y="330" width="540" height="78" rx="10"/>
  <text class="t h" x="46" y="360">③ 控制层　ros2_control</text>
  <text class="t s" x="46" y="384">joint_state_broadcaster + forward_position_controller · 6 关节 · ±1.5 rad</text>
  <rect class="alt" x="596" y="330" width="260" height="78" rx="10"/>
  <text class="t h" x="614" y="360">controller_manager</text>
  <text class="t n" x="614" y="384">2 个 active</text>

  <path class="flow" d="M 298 408 L 298 440"/>

  <!-- ④ 执行器 -->
  <rect class="box" x="28" y="444" width="540" height="96" rx="10"/>
  <text class="t h" x="46" y="474">④ 执行器（三选一，同一套接口）</text>
  <text class="t s" x="46" y="498">mock_components/GenericSystem　—　无物理，验证控制链路</text>
  <text class="t s" x="46" y="520">gz_ros2_control (Gazebo Sim 8)　—　限位生效；接触需 effort 接口</text>
  <rect class="grey" x="596" y="444" width="260" height="96" rx="10"/>
  <text class="t h" x="614" y="474">真机</text>
  <text class="t tag" x="614" y="498">未做（无硬件）</text>
  <text class="tag" x="614" y="518">驱动层限幅仍待验证</text>

  <!-- 反馈回路：右侧留白走线，回到桥接层 -->
  <path class="fb" d="M 880 492 L 920 492 L 920 245 L 862 245"/>
  <text class="t n" transform="rotate(-90 908 372)" x="908" y="372">反馈</text>

  <!-- 底部说明 -->
  <text class="t n" x="28" y="576">反馈：/joint_states（100 Hz） → /vla/tracking_error（指令 − 实际）</text>
  <text class="t tag" x="28" y="600">回归：verify.sh 12 节 51 项 · 严格档在空闲机器上 0 FAIL</text>
</svg>
